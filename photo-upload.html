<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141016"><title>Добавить фото — КирК и КО</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#141016;color:#fff8ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#4a302e,#141016 60%)}main{width:min(100%,540px);margin:auto;padding:calc(25px + env(safe-area-inset-top)) 17px calc(28px + env(safe-area-inset-bottom))}.tag{color:#ffc086;letter-spacing:.11em;font-weight:750;font-size:12px}h1{font-size:clamp(30px,8vw,42px);line-height:1.12;margin:15px 0 8px}p{color:#e3d2c9;line-height:1.45;margin:0 0 17px}.card{border:1px solid #604a54;background:#241d26;border-radius:19px;padding:18px;margin:20px 0}label{display:block;margin-bottom:9px;font-size:14px}input[type=text]{width:100%;border:1px solid #745e69;border-radius:12px;background:#2b232d;color:white;padding:12px 14px;font:16px system-ui}.fileBtn,button{display:block;width:100%;border:0;border-radius:13px;background:#ffc086;color:#21140e;text-decoration:none;text-align:center;font:750 16px system-ui;padding:15px;min-height:52px;cursor:pointer}.fileBtn{margin:17px 0 10px}.secondary{background:#443744!important;color:white!important}button:disabled{opacity:.55;cursor:not-allowed}[hidden]{display:none!important}.meta{font-size:14px;color:#ddcbc4}#preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}#preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#171117}#status{min-height:22px;margin:12px 0;color:#f4e4d8}#status.error{color:#ffafa7}progress{width:100%;height:12px;accent-color:#ffc086}.footer{display:flex;gap:12px;justify-content:space-between;margin-top:24px}.footer a{color:#ffc086}#success{background:#302822;border:1px solid #86715f;border-radius:17px;padding:20px;text-align:center}#success h2{margin:0 0 10px}#success p{margin:0 0 14px}</style></head><body><main><div class="tag">МУЗЫКАЛЬНЫЙ ВЕЧЕР · КИРК И КО</div><h1>Поделись фотографиями 📸</h1><p>Выбери снимки с вечера — они сохранятся в общем альбоме.</p><div class="card"><label for="guest">Твоё имя (необязательно)</label><input id="guest" type="text" maxlength="32" autocomplete="name" placeholder="Как подписать фотографии?"><label class="fileBtn" for="files">Выбрать фото</label><input id="files" type="file" accept="image/*,.heic,.heif" multiple hidden><div id="selection" class="meta">Можно выбрать несколько фотографий сразу.</div><div id="preview"></div><button id="send" hidden>Загрузить фотографии</button><div id="progressBox" hidden><progress id="progress" max="1" value="0"></progress><p id="counter" class="meta"></p></div><p id="status" role="status" aria-live="polite"></p></div><div id="success" hidden><h2>Спасибо! ❤️</h2><p id="summary">Фотографии загружены.</p><button id="more" class="secondary">Добавить ещё</button></div><nav class="footer"><a href="photo-gallery.html">Смотреть альбом →</a><a href="./">На главную</a></nav><script>
const $=id=>document.getElementById(id);const HOST='https://cloud.yarkov.tech',TOKEN='580c7a91064f4012abd6',PARENT_DIR='/Фото ДР/',MAX_PARALLEL=2;let selected=[],urls=[],busy=false;const sizeLimit=30*1024*1024;const allowed=/\.(jpe?g|png|webp|gif|heic|heif|avif)$/i;
function status(msg,error=false){$('status').textContent=msg;$('status').classList.toggle('error',error)}function clearPreview(){urls.forEach(URL.revokeObjectURL);urls=[];$('preview').replaceChildren()}
$('files').addEventListener('change',()=>{if(busy)return;clearPreview();selected=Array.from($('files').files||[]);$('send').hidden=!selected.length;const invalid=selected.filter(f=>!allowed.test(f.name)&&!f.type.startsWith('image/'));const huge=selected.filter(f=>f.size>sizeLimit);$('send').disabled=!!(invalid.length||huge.length);$('selection').textContent=selected.length?`Выбрано фотографий: ${selected.length}`:'Можно выбрать несколько фотографий сразу.';status(invalid.length?'Есть неподдерживаемые файлы. Выбери изображения.':huge.length?'Есть файлы больше 30 МБ. Выбери фотографии поменьше.':'',!!(invalid.length||huge.length));for(const file of selected.slice(0,12)){const url=URL.createObjectURL(file);urls.push(url);const image=document.createElement('img');image.alt=file.name;image.src=url;image.loading='lazy';$('preview').append(image)}});
function filename(file,index){const suffix=(file.name.match(/\.[^.]+$/)||['.jpg'])[0].toLowerCase();const guest=$('guest').value.trim().replace(/[^\p{L}\p{N}_ -]/gu,'').slice(0,24).replace(/\s+/g,'_')||'guest';const when=new Date().toISOString().replace(/[:.]/g,'-');return `kirk_${when}_${guest}_${String(index+1).padStart(2,'0')}_${Math.random().toString(36).slice(2,8)}${suffix}`}
async function getUploadUrl(){const link=await fetch(HOST+'/api/v2.1/upload-links/'+encodeURIComponent(TOKEN)+'/upload/',{method:'GET',mode:'cors',cache:'no-store'});if(!link.ok)throw Error('Не удалось получить адрес загрузки (HTTP '+link.status+')');const data=await link.json();if(typeof data.upload_link!=='string')throw Error('Не получен адрес загрузки');const url=new URL(data.upload_link,HOST);if(url.protocol!=='https:'||url.hostname!==new URL(HOST).hostname)throw Error('Некорректный адрес загрузки');url.searchParams.set('ret-json','1');return url.href}
async function uploadOne(url,file,index){const form=new FormData();form.append('file',file,filename(file,index));form.append('parent_dir',PARENT_DIR);form.append('relative_path','');form.append('replace','0');const reply=await fetch(url,{method:'POST',mode:'cors',body:form});const body=await reply.text();if(!reply.ok)throw Error('HTTP '+reply.status+' '+body.slice(0,100));let result;try{result=JSON.parse(body)}catch{throw Error('сервер не подтвердил загрузку')}if(!Array.isArray(result)||!result.length||!result[0].id||!result[0].name)throw Error('сервер не подтвердил сохранение')}
async function send(){if(busy||!selected.length||$('send').disabled)return;busy=true;$('send').disabled=true;$('files').disabled=true;$('guest').disabled=true;$('progressBox').hidden=false;const batch=selected.slice(),failed=[];let done=0,completed=0,next=0;const progress=()=>{$('progress').value=completed;$('counter').textContent=`Завершено: ${completed} из ${batch.length} · Загружено: ${done}`};$('progress').max=batch.length;$('progress').value=0;progress();try{status('Получаем адрес загрузки…');const url=await getUploadUrl();status('Отправляем фотографии… Не закрывай страницу.');async function worker(){while(next<batch.length){const i=next++;try{await uploadOne(url,batch[i],i);done++}catch(e){failed.push({file:batch[i],error:e.message})}finally{completed++;progress()}}}await Promise.all(Array.from({length:Math.min(MAX_PARALLEL,batch.length)},worker));selected=failed.map(x=>x.file);$('progressBox').hidden=true;if(!failed.length){clearPreview();$('files').value='';$('selection').textContent='Можно выбрать несколько фотографий сразу.';$('send').hidden=true;$('summary').textContent=`Загружено фотографий: ${done}.`;$('success').hidden=false;status('');$('success').scrollIntoView({behavior:'smooth',block:'center'})}else{clearPreview();$('files').value='';$('selection').textContent=`Не удалось отправить: ${failed.length} из ${batch.length}. Остальные ${done} сохранены.`;$('send').hidden=false;status('Ошибка: '+failed[0].file.name+' — '+failed[0].error+'. Нажми «Загрузить фотографии» для повтора только неудачных файлов.',true)}}catch(e){$('progressBox').hidden=true;status('Не удалось начать загрузку: '+e.message+'. Попробуй ещё раз.',true)}finally{busy=false;$('files').disabled=false;$('guest').disabled=false;$('send').disabled=false}}
$('send').onclick=send;$('more').onclick=()=>{$('success').hidden=true;$('files').click()};window.addEventListener('pagehide',clearPreview);
</script></main></body></html>
